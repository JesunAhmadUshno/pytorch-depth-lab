[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-depth-lab"
version = "1.0.0"
description = "Pre-registered measurement study of a hand-written PyTorch training loop vs a Lightning baseline on EuroSAT"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
